<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<!-- displays site properly based on user's device -->
	<link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
		rel="stylesheet">
	<link rel="stylesheet" href="./css/styles.css" />
	<script defer src="./main.js"></script>
	<!-- <script defer src=""></script> -->
	<title>Frontend Mentor | Time tracking dashboard</title>
</head>

<body>
	<main>
		<section class="controls">
			<div class="identifier">
				<img src="./images/image-jeremy.png" alt="" />
				<div class="identifier-text">
					<p>Report for</p>
					<p class="name">Jeremy Robson</p>
				</div>
			</div>
			<div class="timescale-selectors">
				<button class="timescale-selector active">Daily</button>
				<button class="timescale-selector">Weekly</button>
				<button class="timescale-selector">Monthly</button>
			</div>
		</section>
		<section class="activity-cards">
			<article class="activity-card work" tabindex="0">
				<div class="card-content">
					<div class="activity-data">
						<p class="activity-name">Work</p>
						<img src="./images/icon-ellipsis.svg" alt="menu icon" />
					</div>
					<div class="time-spent">32hrs</div>
					<div class="previous-time-spent">Yesterday - 2hrs</div>
				</div>
			</article>
			<article class="activity-card play" tabindex="0">
				<div class="card-content">
					<div class="activity-data">
						<p class="activity-name"></p>
						<img src="./images/icon-ellipsis.svg" alt="menu icon" />
					</div>
					<div class="time-spent"></div>
					<div class="previous-time-spent"></div>
				</div>
			</article>
			<article class="activity-card study" tabindex="0">
				<div class="card-content">
					<div class="activity-data">
						<p class="activity-name"></p>
						<img src="./images/icon-ellipsis.svg" alt="menu icon" />
					</div>
					<div class="time-spent"></div>
					<div class="previous-time-spent"></div>
				</div>
			</article>
			<article class="activity-card exercise" tabindex="0">
				<div class="card-content">
					<div class="activity-data">
						<p class="activity-name"></p>
						<img src="./images/icon-ellipsis.svg" alt="menu icon" />
					</div>
					<div class="time-spent"></div>
					<div class="previous-time-spent"></div>
				</div>
			</article>
			<article class="activity-card social" tabindex="0">
				<div class="card-content">
					<div class="activity-data">
						<p class="activity-name"></p>
						<img src="./images/icon-ellipsis.svg" alt="menu icon" />
					</div>
					<div class="time-spent"></div>
					<div class="previous-time-spent"></div>
				</div>
			</article>
			<article class="activity-card self-care" tabindex="0">
				<div class="card-content">
					<div class="activity-data">
						<p class="activity-name"></p>
						<img src="./images/icon-ellipsis.svg" alt="menu icon" />
					</div>
					<div class="time-spent"></div>
					<div class="previous-time-spent"></div>
				</div>
			</article>
		</section>
	</main>
	<footer class="attribution">
		Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
		Coded by <a href="https://www.frontendmentor.io/profile/kkanit22">Karl Kanitsch</a>.
	</footer>
</body>

</html>
